name: New Dev Prerelease

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Derive next dev version
        id: release
        run: |
          SOURCE_BRANCH="${GITHUB_REF_NAME}"

          if [ "$SOURCE_BRANCH" != "dev" ]; then
            echo "This workflow can only be triggered from the dev branch. Current branch: $SOURCE_BRANCH"
            exit 1
          fi

          VERSION_INFO=$(node - <<'EOF'
          const { execSync } = require("child_process");

          const tags = execSync("git tag --list", { encoding: "utf8" })
            .split("\n")
            .map((tag) => tag.trim())
            .filter(Boolean);

          const releaseTags = tags
            .map((tag) => {
              const match = /^v(\d+)\.(\d+)\.(\d+)(?:-dev)?$/.exec(tag);
              if (!match) return null;
              return {
                tag,
                version: [Number(match[1]), Number(match[2]), Number(match[3])],
              };
            })
            .filter(Boolean)
            .sort((a, b) => {
              for (let i = 0; i < 3; i++) {
                if (a.version[i] !== b.version[i]) return b.version[i] - a.version[i];
              }
              return 0;
            });

          const latest = releaseTags[0];
          if (!latest) {
            process.stderr.write(
              "No release tag found. Use release-create.yml with patch/minor/major to start a release series.\n"
            );
            process.exit(1);
          }

          const nextVersion = [...latest.version];
          nextVersion[2] += 1;
          const version = `${nextVersion.join(".")}-dev`;
          const releaseBranch = `release/v${version}`;

          process.stdout.write(JSON.stringify({ version, releaseBranch }));
          EOF
          )

          NEW_VERSION=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).version)' "$VERSION_INFO")
          RELEASE_BRANCH=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).releaseBranch)' "$VERSION_INFO")

          if git ls-remote --exit-code --heads origin "${RELEASE_BRANCH}" >/dev/null 2>&1 || \
            git show-ref --verify --quiet "refs/heads/${RELEASE_BRANCH}"; then
            echo "Release branch ${RELEASE_BRANCH} already exists."
            exit 1
          fi

          if git rev-parse "v${NEW_VERSION}" >/dev/null 2>&1; then
            echo "Tag v${NEW_VERSION} already exists."
            exit 1
          fi

          git checkout -b "${RELEASE_BRANCH}"

          npm version "${NEW_VERSION}" --no-git-tag-version
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${NEW_VERSION}"

          git push origin "${RELEASE_BRANCH}"
          git tag "v${NEW_VERSION}"
          git push origin "v${NEW_VERSION}"

          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_branch=${RELEASE_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.release.outputs.version }}" \
            --target "${{ steps.release.outputs.release_branch }}" \
            --title "Release v${{ steps.release.outputs.version }}" \
            --prerelease \
            --notes "Release v${{ steps.release.outputs.version }}

          **Source branch:** ${{ github.ref_name }}
          **Release branch:** ${{ steps.release.outputs.release_branch }}
          **Commit:** $(git rev-parse HEAD)"

      - name: Trigger release deploy workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy-release.yml \
            --ref "${{ steps.release.outputs.release_branch }}"
