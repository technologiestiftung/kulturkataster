name: Create Release Branch

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Calculate version and prepare release branch
        id: release
        run: |
          SOURCE_BRANCH="${GITHUB_REF_NAME}"

          if [ "$SOURCE_BRANCH" != "main" ] && [ "$SOURCE_BRANCH" != "dev" ]; then
            echo "Releases can only be created from main or dev. Current branch: $SOURCE_BRANCH"
            exit 1
          fi

          VERSION_INFO=$(node - <<'EOF'
          const { execSync } = require("child_process");

          const sourceBranch = process.env.SOURCE_BRANCH;
          const bumpType = process.env.BUMP_TYPE;

          const tags = execSync("git tag --list", { encoding: "utf8" })
            .split("\n")
            .map((tag) => tag.trim())
            .filter(Boolean);

          const stableTags = tags
            .map((tag) => {
              const match = /^v(\d+)\.(\d+)\.(\d+)$/.exec(tag);
              if (!match) return null;
              return {
                tag,
                version: [Number(match[1]), Number(match[2]), Number(match[3])],
              };
            })
            .filter(Boolean)
            .sort((a, b) => {
              for (let index = 0; index < 3; index += 1) {
                if (a.version[index] !== b.version[index]) {
                  return b.version[index] - a.version[index];
                }
              }
              return 0;
            });

          const latestStable = stableTags[0]?.version ?? [0, 0, 0];
          const [major, minor, patch] = latestStable;

          let nextStable;
          if (bumpType === "major") {
            nextStable = [major + 1, 0, 0];
          } else if (bumpType === "minor") {
            nextStable = [major, minor + 1, 0];
          } else if (bumpType === "patch") {
            nextStable = [major, minor, patch + 1];
          } else {
            throw new Error(`Unsupported version bump type: ${bumpType}`);
          }

          const baseVersion = nextStable.join(".");

          if (sourceBranch === "main") {
            process.stdout.write(JSON.stringify({
              version: baseVersion,
              releaseBranch: `release/v${baseVersion}`,
              isPrerelease: false,
            }));
            process.exit(0);
          }

          const prereleaseVersion = `${baseVersion}-dev`;

          process.stdout.write(JSON.stringify({
            version: prereleaseVersion,
            releaseBranch: `release/v${prereleaseVersion}`,
            isPrerelease: true,
          }));
          EOF
          )

          NEW_VERSION=$(node -e 'const info = JSON.parse(process.argv[1]); process.stdout.write(info.version);' "$VERSION_INFO")
          RELEASE_BRANCH=$(node -e 'const info = JSON.parse(process.argv[1]); process.stdout.write(info.releaseBranch);' "$VERSION_INFO")
          IS_PRERELEASE=$(node -e 'const info = JSON.parse(process.argv[1]); process.stdout.write(String(info.isPrerelease));' "$VERSION_INFO")

          BRANCH_EXISTS=false
          REMOTE_RELEASE_SHA=""
          if git ls-remote --exit-code --heads origin "${RELEASE_BRANCH}" >/dev/null 2>&1; then
            BRANCH_EXISTS=true
            REMOTE_RELEASE_SHA=$(git ls-remote --heads origin "${RELEASE_BRANCH}" | awk '{print $1}')
          fi

          TAG_EXISTS=false
          if git rev-parse "v${NEW_VERSION}" >/dev/null 2>&1; then
            TAG_EXISTS=true
          fi

          if [ "${IS_PRERELEASE}" != "true" ] && [ "${BRANCH_EXISTS}" = "true" ]; then
            echo "Release branch ${RELEASE_BRANCH} already exists. Stable releases are immutable."
            exit 1
          fi

          if [ "${IS_PRERELEASE}" != "true" ] && [ "${TAG_EXISTS}" = "true" ]; then
            echo "Tag v${NEW_VERSION} already exists. Stable releases are immutable."
            exit 1
          fi

          if [ "${IS_PRERELEASE}" = "true" ] && { [ "${BRANCH_EXISTS}" = "true" ] || [ "${TAG_EXISTS}" = "true" ]; }; then
            echo "Updating existing mutable dev prerelease v${NEW_VERSION}."
          fi

          git fetch origin "${SOURCE_BRANCH}" --tags
          git checkout -B "${RELEASE_BRANCH}" "origin/${SOURCE_BRANCH}"

          npm version "${NEW_VERSION}" --no-git-tag-version
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "package.json and package-lock.json already contain ${NEW_VERSION}."
          else
            git commit -m "chore: bump version to ${NEW_VERSION}"
          fi

          if [ "${IS_PRERELEASE}" = "true" ]; then
            if [ -n "${REMOTE_RELEASE_SHA}" ]; then
              git push --force-with-lease="refs/heads/${RELEASE_BRANCH}:${REMOTE_RELEASE_SHA}" origin "${RELEASE_BRANCH}"
            else
              git push origin "${RELEASE_BRANCH}"
            fi
            git tag --force "v${NEW_VERSION}"
            git push --force origin "v${NEW_VERSION}"
          else
            git push origin "${RELEASE_BRANCH}"
            git tag "v${NEW_VERSION}"
            git push origin "v${NEW_VERSION}"
          fi

          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_branch=${RELEASE_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "source_branch=${SOURCE_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
          BUMP_TYPE: ${{ github.event.inputs.version }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_ARGS=()
          if [ "${{ steps.release.outputs.is_prerelease }}" = "true" ]; then
            RELEASE_ARGS+=(--prerelease)
          fi

          RELEASE_NOTES="Release v${{ steps.release.outputs.version }}

          **Source branch:** ${{ steps.release.outputs.source_branch }}
          **Release branch:** ${{ steps.release.outputs.release_branch }}
          **Commit:** $(git rev-parse HEAD)"

          if gh release view "v${{ steps.release.outputs.version }}" >/dev/null 2>&1; then
            if [ "${{ steps.release.outputs.is_prerelease }}" != "true" ]; then
              echo "Release v${{ steps.release.outputs.version }} already exists. Stable releases are immutable."
              exit 1
            fi

            gh release edit "v${{ steps.release.outputs.version }}" \
              --target "${{ steps.release.outputs.release_branch }}" \
              --title "Release v${{ steps.release.outputs.version }}" \
              --notes "${RELEASE_NOTES}" \
              --prerelease
          else
            gh release create "v${{ steps.release.outputs.version }}" \
              --target "${{ steps.release.outputs.release_branch }}" \
              --title "Release v${{ steps.release.outputs.version }}" \
              --notes "${RELEASE_NOTES}" \
              "${RELEASE_ARGS[@]}"
          fi

      - name: Trigger release deploy workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy-release.yml \
            --ref "${{ steps.release.outputs.release_branch }}"
