name: Sync Traduora Translations

on:
  # Trigger on manual workflow dispatch
  workflow_dispatch:
    inputs:
      action:
        description: 'Sync action to perform'
        required: true
        type: choice
        options:
          - pull
          - pull --all
          - push
          - push --all
        default: 'pull'

  schedule:
    - cron: '0 2 * * *'

jobs:
  sync-translations:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'dev' && 'dev' || 'main' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Check lockfile sync
        run: |
          if ! npm ci --dry-run --ignore-scripts --no-audit --no-fund; then
            echo "package-lock.json is out of sync with package.json"
            echo "Run 'npm install' locally and commit the updated lockfile."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Determine sync action
        id: action
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            echo "action=pull --all" >> $GITHUB_OUTPUT
            echo "Running scheduled pull --all to sync all translator updates"
          else
            echo "action=${{ github.event.inputs.action }}" >> $GITHUB_OUTPUT
            echo "Running manual ${{ github.event.inputs.action }}"
          fi

      - name: Pull translations from Traduora
        if: startsWith(steps.action.outputs.action, 'pull')
        env:
          TRADUORA_API_URL: ${{ vars.TRADUORA_API_URL }}
          TRADUORA_CLIENT_ID: ${{ vars.TRADUORA_CLIENT_ID }}
          TRADUORA_CLIENT_SECRET: ${{ secrets.TRADUORA_CLIENT_SECRET }}
          TRADUORA_PROJECT_ID: ${{ vars.TRADUORA_PROJECT_ID }}
        run: |
          echo "📥 Pulling translations from Traduora..."
          npm run traduora:sync ${{ steps.action.outputs.action }}
          npm run format:fix

      - name: Push translations to Traduora
        if: startsWith(steps.action.outputs.action, 'push')
        env:
          TRADUORA_API_URL: ${{ vars.TRADUORA_API_URL }}
          TRADUORA_CLIENT_ID: ${{ vars.TRADUORA_CLIENT_ID }}
          TRADUORA_CLIENT_SECRET: ${{ secrets.TRADUORA_CLIENT_SECRET }}
          TRADUORA_PROJECT_ID: ${{ vars.TRADUORA_PROJECT_ID }}
        run: |
          echo "📤 Pushing translations to Traduora..."
          npm run traduora:sync ${{ steps.action.outputs.action }}

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected:"
            git status
            git diff --stat
          fi

      - name: Create Pull Request
        if: steps.check_changes.outputs.changes == 'true' && startsWith(steps.action.outputs.action, 'pull')
        env:
          HUSKY: 0
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            feat: sync translations from Traduora

            🤖 Generated with [Claude Code](https://claude.ai/code)

            Co-Authored-By: Claude <noreply@anthropic.com>
          title: 'feat: sync translations from Traduora'
          body: |
            ## Summary
            - Pulled latest translations from Traduora
            - Updated local translation files with translator updates
            - Mode: ${{ steps.action.outputs.action }}

            ## Changes
            This PR contains automatic translation synchronization from Traduora:
            - ✓ Updated translations with latest Traduora values
            - ✓ Preserved local-only translation keys
            - ✓ Synced all locales

            ## Test plan
            - [ ] Review translation changes for accuracy
            - [ ] Test application with updated translations
            - [ ] Verify all locales are properly synced

            🤖 Generated with [Claude Code](https://claude.ai/code)
          branch: traduora-sync/pull-${{ github.run_number }}
          base: ${{ github.ref_name }}
          draft: false
          labels: translations,automated

      - name: Commit changes (push action)
        if: steps.check_changes.outputs.changes == 'true' && startsWith(steps.action.outputs.action, 'push')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/lib/i18n/translations/
          git commit -m "feat: push local translations to Traduora

          🤖 Generated with [Claude Code](https://claude.ai/code)

          Co-Authored-By: Claude <noreply@anthropic.com>"
          echo "Changes committed locally (not pushed to remote)"

      - name: Post summary
        if: always()
        run: |
          echo "## Traduora Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Action**: ${{ steps.action.outputs.action }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_changes.outputs.changes }}" == "true" ]; then
            if [ "${{ steps.action.outputs.action }}" == "pull" ]; then
              echo "- **Result**: ✅ Translations pulled and PR created" >> $GITHUB_STEP_SUMMARY
            else
              echo "- **Result**: ✅ Translations pushed to Traduora" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "- **Result**: ℹ️ No changes detected" >> $GITHUB_STEP_SUMMARY
          fi
