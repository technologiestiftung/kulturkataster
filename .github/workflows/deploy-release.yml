name: Deploy App (Release)

on:
  push:
    branches:
      - "release/main-v*"
      - "release/v*"
      - "release/dev-v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: deploy-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      deploy_track: ${{ steps.release.outputs.deploy_track }}
      environment_name: ${{ steps.release.outputs.environment_name }}
      environment_label: ${{ steps.release.outputs.environment_label }}
      release_tag: ${{ steps.release.outputs.release_tag }}

    steps:
      - name: Derive release metadata from branch name
        id: release
        run: |
          BRANCH="${GITHUB_REF_NAME}"

          case "$BRANCH" in
            release/main-v*)
              DEPLOY_TRACK="main"
              ENVIRONMENT_NAME="main"
              ENVIRONMENT_LABEL="prod"
              RELEASE_TAG="${BRANCH#release/main-}"
              ;;
            release/v*)
              DEPLOY_TRACK="main"
              ENVIRONMENT_NAME="main"
              ENVIRONMENT_LABEL="prod"
              RELEASE_TAG="${BRANCH#release/}"
              ;;
            release/dev-v*)
              DEPLOY_TRACK="dev"
              ENVIRONMENT_NAME="dev"
              ENVIRONMENT_LABEL="dev"
              RELEASE_TAG="${BRANCH#release/dev-}"
              ;;
            *)
              echo "Unsupported release branch: $BRANCH"
              exit 1
              ;;
          esac

          echo "deploy_track=${DEPLOY_TRACK}" >> "$GITHUB_OUTPUT"
          echo "environment_name=${ENVIRONMENT_NAME}" >> "$GITHUB_OUTPUT"
          echo "environment_label=${ENVIRONMENT_LABEL}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: prepare
    environment: ${{ needs.prepare.outputs.environment_name }}
    permissions:
      contents: read
      packages: write
    env:
      DEPLOY_TRACK: ${{ needs.prepare.outputs.deploy_track }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }},enable=${{ env.DEPLOY_TRACK == 'main' }}
            type=raw,value=dev-${{ env.RELEASE_TAG }},enable=${{ env.DEPLOY_TRACK == 'dev' }}
          flavor: |
            latest=false

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_MAPTILER_API_KEY=${{ secrets.MAPTILER_API_KEY }}
            NEXT_PUBLIC_MAP_BOUNDING_BOX=${{ vars.NEXT_PUBLIC_MAP_BOUNDING_BOX }}
            NEXT_PUBLIC_BRANCH=${{ env.DEPLOY_TRACK }}
            TRADUORA_API_URL=${{ vars.TRADUORA_API_URL }}
            TRADUORA_CLIENT_ID=${{ vars.TRADUORA_CLIENT_ID }}
            TRADUORA_CLIENT_SECRET=${{ secrets.TRADUORA_CLIENT_SECRET }}
            TRADUORA_PROJECT_ID=${{ vars.TRADUORA_PROJECT_ID }}

  backup:
    runs-on: ubuntu-latest
    needs: prepare
    environment: ${{ needs.prepare.outputs.environment_name }}
    permissions:
      contents: read
    env:
      DEPLOY_TRACK: ${{ needs.prepare.outputs.deploy_track }}
      ENVIRONMENT_LABEL: ${{ needs.prepare.outputs.environment_label }}

    steps:
      - name: Create database backup via Supavisor
        run: |
          SUPAVISOR_URL="postgresql://postgres.${{ vars.SUPABASE_TENANT_ID }}:${{ secrets.SUPABASE_DB_PASSWORD }}@supavisor-transaction.kuka-api.ionos-${DEPLOY_TRACK}.ds-apps.tsb-berlin.de:443/postgres?sslmode=require"

          mkdir -p ./backups

          TIMESTAMP=$(date +%F_%H%M%S)
          FULL_BACKUP="./backups/full_backup_${ENVIRONMENT_LABEL}_${TIMESTAMP}.sql"
          DATA_BACKUP="./backups/data_only_${ENVIRONMENT_LABEL}_${TIMESTAMP}.sql"

          echo "Creating database backup via Supavisor pooler..."

          sudo apt-get update && sudo apt-get install -y postgresql-client

          echo "Creating full backup..."
          if pg_dump "$SUPAVISOR_URL" > "$FULL_BACKUP"; then
            echo "Full backup created: $(ls -lh $FULL_BACKUP)"
          else
            echo "Full backup failed"
            exit 1
          fi

          echo "Creating data-only backup..."
          if pg_dump "$SUPAVISOR_URL" --data-only > "$DATA_BACKUP"; then
            echo "Data-only backup created: $(ls -lh $DATA_BACKUP)"
          else
            echo "Data-only backup failed, continuing with full backup only"
            rm -f "$DATA_BACKUP"
          fi

          if [ ! -s "$FULL_BACKUP" ]; then
            echo "Full backup is empty"
            exit 1
          fi

          echo "Backup(s) completed successfully"
          ls -lah ./backups/

      - name: Upload backups to IONOS S3
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.IONOS_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.IONOS_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.IONOS_S3_REGION }}
          IONOS_S3_ENDPOINT: ${{ vars.IONOS_S3_ENDPOINT }}
          IONOS_S3_BUCKET: ${{ vars.IONOS_S3_BUCKET }}
        run: |
          aws s3 cp ./backups/ "s3://${IONOS_S3_BUCKET}/${{ github.run_number }}/" \
            --recursive \
            --endpoint-url "${IONOS_S3_ENDPOINT}"

  migrations:
    runs-on: ubuntu-latest
    needs: [prepare, backup]
    environment: ${{ needs.prepare.outputs.environment_name }}
    permissions:
      contents: read
    env:
      DEPLOY_TRACK: ${{ needs.prepare.outputs.deploy_track }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma migrations
        run: |
          SUPAVISOR_URL="postgresql://postgres.${{ vars.SUPABASE_TENANT_ID }}:${{ secrets.SUPABASE_DB_PASSWORD }}@supavisor-session.kuka-api.ionos-${DEPLOY_TRACK}.ds-apps.tsb-berlin.de:443/postgres?sslmode=require"
          echo "Running Prisma migrations via Supavisor transaction pooler..."

          export DATABASE_URL="${SUPAVISOR_URL}"
          npx prisma generate
          npx prisma migrate deploy

          echo "Prisma migrations completed successfully"

  deploy:
    runs-on: ubuntu-latest
    needs: [prepare, build, migrations]
    environment: ${{ needs.prepare.outputs.environment_name }}
    permissions:
      contents: write
    env:
      DEPLOY_TRACK: ${{ needs.prepare.outputs.deploy_track }}
      ENVIRONMENT_LABEL: ${{ needs.prepare.outputs.environment_label }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create deployment tag
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          TAG_NAME="deploy-${ENVIRONMENT_LABEL}-${TIMESTAMP}"

          echo "Creating deployment tag: ${TAG_NAME}"
          git tag -a "${TAG_NAME}" -m "Frontend deployment to ${ENVIRONMENT_LABEL} at $(date)"

          if ! git push origin "${TAG_NAME}"; then
            echo "Failed to push deployment tag"
            exit 1
          fi

          echo "Deployment tag created: ${TAG_NAME}"
          echo "View at: https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}"
