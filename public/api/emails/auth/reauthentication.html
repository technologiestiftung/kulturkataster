<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sicherheitsbestätigung</title>
  </head>
  <body style="margin:0;padding:24px;background:#f8f6f2;font-family:Barlow,Arial,Helvetica,sans-serif;color:#161616;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td align="center">
          <table role="presentation" width="620" cellspacing="0" cellpadding="0" style="max-width:620px;width:100%;background:#ffffff;border:1px solid #e2dfdb;border-radius:12px;">
            <tr>
              <td style="padding:28px 24px 8px 24px;font-size:24px;line-height:1.2;font-weight:700;">Sicherheitsbestätigung</td>
            </tr>
            <tr>
              <td style="padding:0 24px 16px 24px;font-size:16px;line-height:1.6;">
                <p style="margin:0 0 16px 0;">Bitte bestätigen Sie diesen Vorgang.</p>
                <p style="margin:0 0 16px 0;">Einmalcode: <strong style="font-size:20px;letter-spacing:1px;">{{ .Token }}</strong></p>
              </td>
            </tr>
            <tr>
              <td style="padding:0 24px 24px 24px;">
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#c288ff;color:#161616;text-decoration:none;padding:12px 18px;border-radius:4px;font-size:16px;line-height:1.5;font-weight:700;">Vorgang bestätigen</a>
              </td>
            </tr>
            <tr>
              <td style="padding:0 24px 16px 24px;font-size:16px;line-height:1.6;">
                <p style="margin:0 0 16px 0;">Falls der Button nicht funktioniert, kopieren Sie diesen Link in Ihren Browser:</p>
                <p style="margin:0 0 16px 0;word-break:break-all;color:#555b54;font-size:14px;">{{ .ConfirmationURL }}</p>
                <p style="margin:0;">Viele Grüße<br />vom Projektteam Kulturkataster</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
