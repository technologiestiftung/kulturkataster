<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Reauthentifizierung bestaetigen</title>
  </head>
  <body style="margin:0;padding:24px;background:#fff7ed;font-family:Arial,Helvetica,sans-serif;color:#111827;">
    <div style="max-width:620px;margin:0 auto;background:#ffffff;border-radius:12px;padding:28px 24px;">
      <h1 style="margin:0 0 12px 0;font-size:24px;">Reauthentifizierung bestaetigen</h1>
      <p style="margin:0 0 14px 0;font-size:16px;line-height:1.6;">
        Bestaetigen Sie den Vorgang mit dem folgenden Einmalcode oder Link.
      </p>
      <p style="margin:0 0 18px 0;font-size:18px;">
        Code:
        <strong>{{ .Token }}</strong>
      </p>
      <p style="margin:0 0 22px 0;">
        <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#9a3412;color:#ffffff;text-decoration:none;padding:12px 18px;border-radius:8px;font-weight:600;">Bestaetigen</a>
      </p>
      <p style="margin:0;font-size:13px;color:#6b7280;">
        Empfaenger: {{ .Email }}
        <br />Site URL: {{ .SiteURL }}
        <br />Redirect: {{ .RedirectTo }}
        <br />Metadata: {{ .Data }}
      </p>
    </div>
  </body>
</html>
