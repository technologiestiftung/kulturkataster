<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="850" viewBox="0 0 600 850" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 20px; text-anchor: middle; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .sublabel { font-family: Arial, Helvetica, sans-serif; font-size: 16px; text-anchor: middle; }
      .grid-label-y { font-family: Arial, Helvetica, sans-serif; font-size: 16px; text-anchor: end; dominant-baseline: central; }
      .grid-box-num { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: white; text-anchor: middle; dominant-baseline: central; font-weight: bold;}
      .grid-box-code { font-family: Arial, Helvetica, sans-serif; font-size: 16px; dominant-baseline: central; }
      .annotation { font-family: Arial, Helvetica, sans-serif; font-size: 12px; text-anchor: middle; }
      .key-code { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: bold; }
      .key-text { font-family: Arial, Helvetica, sans-serif; font-size: 16px; }
      .final-box-num { font-family: Arial, Helvetica, sans-serif; font-size: 20px; fill: black; text-anchor: middle; dominant-baseline: central; font-weight: bold;}
    </style>
  </defs>

  <rect width="100%" height="100%" fill="white"/>

  <!-- Title Block -->
  <g class="title">
    <text x="300" y="40">Gebietsbezogene Überlagerung</text>
    <text x="300" y="65">des Status-Index (4 Klassen)</text>
    <text x="300" y="90">mit dem Dynamik-Index (3 Klassen)</text>
    <text x="300" y="115">auf Ebene der Planungsräume (542 PLR)</text>
    <text x="300" y="140">zum Gesamtindex Soziale Ungleichheit</text>
    <text x="300" y="165">(Status/Dynamik-Index) in 12 Gruppen.</text>
  </g>

  <!-- Grid -->
  <g>
    <!-- Column Labels -->
    <text class="label" x="325" y="200">Status</text>
    <text class="label" x="180" y="220">hoch</text>
    <text class="sublabel" x="180" y="240">1</text>
    <text class="label" x="280" y="220">mittel</text>
    <text class="sublabel" x="280" y="240">2</text>
    <text class="label" x="380" y="220">niedrig</text>
    <text class="sublabel" x="380" y="240">3</text>
    <text class="label" x="480" y="220">sehr niedrig</text>
    <text class="sublabel" x="480" y="240">4</text>

    <!-- Row Labels -->
    <text class="label" transform="translate(40, 325) rotate(-90)">Dynamik</text>
    <text class="grid-label-y" x="120" y="275">positiv +</text>
    <text class="grid-label-y" x="120" y="325">stabil ±</text>
    <text class="grid-label-y" x="120" y="375">negativ -</text>

    <!-- Grid Cells -->
    <!-- Row 1: positiv -->
    <g>
      <rect x="160" y="255" width="40" height="40" fill="#C5E0B4" stroke="#7F7F7F" stroke-width="1"/>
      <text class="grid-box-num" x="180" y="275">3</text>
      <text class="grid-box-code" x="205" y="275">1+</text>
    </g>
    <g>
      <rect x="260" y="255" width="40" height="40" fill="#BDD7EE" stroke="#7F7F7F" stroke-width="1"/>
      <text class="grid-box-num" x="280" y="275">33</text>
      <text class="grid-box-code" x="305" y="275">2+</text>
    </g>
    <g>
      <rect x="360" y="255" width="40" height="40" fill="#FFD966" stroke="#7F7F7F" stroke-width="1"/>
      <text class="grid-box-num" x="380" y="275">15</text>
      <text class="grid-box-code" x="405" y="275">3+</text>
    </g>
    <g>
      <rect x="460" y="255" width="40" height="40" fill="#F8CBAD" stroke="#7F7F7F" stroke-width="1"/>
      <text class="grid-box-num" x="480" y="275">22</text>
      <text class="grid-box-code" x="505" y="275">4+</text>
    </g>

    <!-- Row 2: stabil -->
    <g>
      <rect x="160" y="305" width="40" height="40" fill="#A9D18E" stroke="#7F7F7F" stroke-width="1"/>
      <text class="grid-box-num" x="180" y="325">66</text>
      <text class="grid-box-code" x="205" y="325">1±</text>
    </g>
    <g>
      <rect x="260" y="305" width="40" height="40" fill="#9CC3E5" stroke="#7F7F7F" stroke-width="1"/>
      <text class="grid-box-num" x="280" y="325">284</text>
      <text class="grid-box-code" x="305" y="325">2±</text>
    </g>
    <g>
      <rect x="360" y="305" width="40" height="40" fill="#FFC000" stroke="#7F7F7F" stroke-width="1"/>
      <text class="grid-box-num" x="380" y="325">35</text>
      <text class="grid-box-code" x="405" y="325">3±</text>
    </g>
    <g>
      <rect x="460" y="305" width="40" height="40" fill="#F4B183" stroke="#7F7F7F" stroke-width="1"/>
      <text class="grid-box-num" x="480" y="325">26</text>
      <text class="grid-box-code" x="505" y="325">4±</text>
    </g>
    
    <!-- Row 3: negativ -->
    <g>
      <rect x="160" y="355" width="40" height="40" fill="#70AD47" stroke="#7F7F7F" stroke-width="1"/>
      <text class="grid-box-num" x="180" y="375">17</text>
      <text class="grid-box-code" x="205" y="375">1-</text>
    </g>
    <g>
      <rect x="260" y="355" width="40" height="40" fill="#5B9BD5" stroke="#7F7F7F" stroke-width="1"/>
      <text class="grid-box-num" x="280" y="375">33</text>
      <text class="grid-box-code" x="305" y="375">2-</text>
    </g>
    <g>
      <rect x="360" y="355" width="40" height="40" fill="#BF8F00" stroke="#7F7F7F" stroke-width="1"/>
      <text class="grid-box-num" x="380" y="375">2</text>
      <text class="grid-box-code" x="405" y="375">3-</text>
    </g>
    <g>
      <rect x="460" y="355" width="40" height="40" fill="#C00000" stroke="#7F7F7F" stroke-width="1"/>
      <text class="grid-box-num" x="480" y="375">0</text>
      <text class="grid-box-code" x="505" y="375">4-</text>
    </g>
  </g>
  
  <!-- Annotation under grid -->
  <text class="annotation" x="330" y="415">(Index: 1.Stelle Status, 2. Stelle Dynamik; Wert in Kästchen: Anzahl der PLR)</text>

  <!-- Legend Key List -->
  <g>
    <text class="key-code" x="60" y="460">1+</text> <text class="key-text" x="120" y="460">hohem Status und positiver Dynamik</text>
    <text class="key-code" x="60" y="485">1+/-</text> <text class="key-text" x="120" y="485">hohem Status und stabiler Dynamik</text>
    <text class="key-code" x="60" y="510">1-</text> <text class="key-text" x="120" y="510">hohem Status und negativer Dynamik</text>

    <text class="key-code" x="60" y="545">2+</text> <text class="key-text" x="120" y="545">mittlerem Status und positiver Dynamik</text>
    <text class="key-code" x="60" y="570">2+/-</text> <text class="key-text" x="120" y="570">mittlerem Status und stabiler Dynamik</text>
    <text class="key-code" x="60" y="595">2-</text> <text class="key-text" x="120" y="595">mittlerem Status und negativer Dynamik</text>

    <text class="key-code" x="60" y="630">3+</text> <text class="key-text" x="120" y="630">niedrigem Status und positiver Dynamik</text>
    <text class="key-code" x="60" y="655">3+/-</text> <text class="key-text" x="120" y="655">niedrigem Status und stabiler Dynamik</text>
    <text class="key-code" x="60" y="680">3-</text> <text class="key-text" x="120" y="680">niedrigem Status und negativer Dynamik</text>

    <text class="key-code" x="60" y="715">4+</text> <text class="key-text" x="120" y="715">sehr niedrigem Status und positiver Dynamik</text>
    <text class="key-code" x="60" y="740">4+/-</text> <text class="key-text" x="120" y="740">sehr niedrigem Status und stabiler Dynamik</text>
    <text class="key-code" x="60" y="765">4-</text> <text class="key-text" x="120" y="765">sehr niedrigem Status und negativer Dynamik</text>
  </g>
  
  <!-- Final Element -->
  <g>
    <rect x="60" y="800" width="40" height="40" fill="#D9D9D9" stroke="#7F7F7F" stroke-width="1"/>
    <text class="final-box-num" x="80" y="820">6</text>
    <text class="key-text" x="120" y="820" dominant-baseline="central">Planungsraum ohne Zuordnung</text>
  </g>
</svg>